# Weekly dependency updates: minor and patch updates in one grouped pull request per ecosystem,
# each major update in a pull request of its own, so one breaking release (zip 9, TypeScript 7)
# does not hold back the rest.
#
# Updated by hand, not here:
# - tauri-specta, specta and specta-typescript are pinned on purpose (docs/decisions.md D1);
# - Tauri itself: the `tauri*` crates and the `@tauri-apps/*` packages must move together (the
#   CLI refuses a mismatched minor version), and Dependabot cannot group across ecosystems.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: tauri-specta
      - dependency-name: specta
      - dependency-name: specta-typescript
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
