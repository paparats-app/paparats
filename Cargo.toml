[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88: let chains (edition 2024) and keyring 4 (M7).
rust-version = "1.88"
license = "MIT"
authors = ["Paparats"]
publish = false

[workspace.dependencies]
# Internal crates
paparats-core = { path = "crates/paparats-core" }
paparats-catalog = { path = "crates/paparats-catalog" }
paparats-download = { path = "crates/paparats-download" }
paparats-install = { path = "crates/paparats-install" }
paparats-inventory = { path = "crates/paparats-inventory" }
paparats-storage = { path = "crates/paparats-storage" }
paparats-account = { path = "crates/paparats-account" }

# Serialization, errors, logging
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Storage, network, crypto, dates
rusqlite = { version = "0.40", features = ["bundled"] }
# Schannel on Windows through native-tls: no OpenSSL, no aws-lc/ring build.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# 0.11 is the version ed25519-dalek 3 already pulls in (one SHA-2 implementation in the tree).
sha2 = "0.11"
ed25519-dalek = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Logging (local rolling file only)
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2"

# The catalog bot's app files (catalog repository: apps/<id>.toml, editorial.toml).
toml = "1"

# Encoding, URLs, patterns, randomness (manifest envelopes, OAuth, detection rules, PKCE)
base64 = "0.22"
url = "2"
regex = "1"
# The OS CSPRNG (PKCE verifier and state, `sign-manifest --generate-key`).
getrandom = "0.3"

# Tests
tempfile = "3"

# Typed IPC (tauri-specta and specta must stay on the same release candidate)
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Tauri
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-window-state = "2.4"
tauri-plugin-opener = "2.5"
# Settings persistence (settings.json in the app data dir, STACK.md decision 4).
tauri-plugin-store = "2.4"
# Windows integration (M6): start on login, one running instance, paparats:// links, self-update.
tauri-plugin-autostart = "2.5"
tauri-plugin-deep-link = "2.4"
# `deep-link`: a second launch hands its paparats:// URL to the running instance's handler.
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
# Schannel through native-tls like the download engine (D23); NSIS updates need no zip support.
tauri-plugin-updater = { version = "2.12", default-features = false, features = ["native-tls"] }
# Reads the login entry (HKCU Run) that tauri-plugin-autostart writes; already in the tree.
windows-registry = "0.5"

# Real strategies (M7, PAPARATS_REAL). Windows-only crates are declared per crate under
# `[target.'cfg(windows)'.dependencies]`; features are chosen by each crate.
# Installed apps: Uninstall keys and UserAssist (safe API).
winreg = "0.56"
# Authenticode, MSI, MSIX, known folders, shortcuts (install); MSIX packages (inventory).
windows = "0.62"
# `IIterable<Uri>` for `AddPackageAsync` (the version `windows` 0.62 itself uses).
windows-collections = "0.3"
# Portable ZIP packages (features per crate). 7.x keeps the deflate64 support the installer needs.
zip = { version = "9.0", default-features = false }
# OAuth tokens in the Windows Credential Manager.
keyring = "4"
keyring-core = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
