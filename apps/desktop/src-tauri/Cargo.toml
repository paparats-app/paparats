[package]
name = "paparats-desktop"
description = "Paparats — curated app store for Windows (desktop client)"
default-run = "paparats-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "paparats_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "paparats-desktop"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
paparats-core.workspace = true
tauri.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-opener.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true

[lints]
workspace = true
