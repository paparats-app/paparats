[package]
name = "paparats-desktop"
description = "Paparats — curated app store for Windows (desktop client)"
default-run = "paparats-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "paparats_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "paparats-desktop"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
paparats-core.workspace = true
paparats-catalog.workspace = true
paparats-storage.workspace = true
paparats-download.workspace = true
paparats-install.workspace = true
paparats-inventory.workspace = true
paparats-account.workspace = true
tauri.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tokio = { workspace = true, features = ["time"] }
chrono = { workspace = true, features = ["clock"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["test-util", "rt", "macros"] }

[lints]
workspace = true
